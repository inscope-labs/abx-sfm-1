name: Build Debug APK

on:
  workflow_dispatch:

concurrency:
  group: build-apk-debug-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.1"

      - name: Ensure debug keystore exists
        # app/build.gradle.kts debugConfig signing expects ${rootDir}/debug.keystore.
        # It is not committed to the repo, so generate a standard Android debug
        # keystore here if absent. This uses well-known, non-secret credentials
        # (androiddebugkey / android) — debug-only, never used for release signing.
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -keystore debug.keystore \
              -storepass android \
              -keypass android \
              -alias androiddebugkey \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated new debug.keystore for this run."
          else
            echo "debug.keystore already present, using it."
          fi

      - name: Read version info
        id: version
        run: |
          if [ -f version.properties ]; then
            VERSION_CODE=$(grep -E '^versionCode=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
            VERSION_NAME=$(grep -E '^versionName=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
            DEBUG_CODE=$(grep -E '^debugCode=' version.properties | cut -d'=' -f2 | tr -d '[:space:]')
          fi
          echo "version_code=${VERSION_CODE:-unknown}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME:-unknown}" >> "$GITHUB_OUTPUT"
          echo "debug_code=${DEBUG_CODE:-unknown}" >> "$GITHUB_OUTPUT"

      - name: Lint (non-blocking)
        run: gradle lintDebug
        continue-on-error: true

      - name: Unit tests
        run: gradle testDebugUnitTest

      - name: Assemble debug APK
        run: gradle assembleDebug --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "No debug APK found under app/build/outputs/apk/debug" >&2
            exit 1
          fi
          echo "path=$APK_PATH" >> "$GITHUB_OUTPUT"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: abx-sfm-debug-v${{ steps.version.outputs.version_name }}-code${{ steps.version.outputs.version_code }}-d${{ steps.version.outputs.debug_code }}
          path: ${{ steps.apk.outputs.path }}
          retention-days: 14
          if-no-files-found: error

      - name: Upload lint report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14
          if-no-files-found: ignore

      - name: Upload unit test report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          retention-days: 14
          if-no-files-found: ignore

      - name: Summary
        if: always()
        run: |
          {
            echo "### Debug build summary"
            echo ""
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| versionName | ${{ steps.version.outputs.version_name }} |"
            echo "| versionCode | ${{ steps.version.outputs.version_code }} |"
            echo "| debugCode | ${{ steps.version.outputs.debug_code }} |"
            echo "| APK | ${{ steps.apk.outputs.path }} |"
          } >> "$GITHUB_STEP_SUMMARY"
